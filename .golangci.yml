version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    errcheck:
      # These are the "don't care" categories every command/proxy
      # handler in this codebase hits constantly: writing CLI output,
      # closing a connection/file on a cleanup path, setting a read
      # deadline that only fails if the conn is already gone. None of
      # these are the fail-closed-relevant writes this project
      # actually cares about (audit log writes, scope decisions) —
      # those are already explicitly checked everywhere, which is what
      # keeps errcheck worth running at all instead of disabling it.
      exclude-functions:
        - (net.Conn).Close
        - (net.Listener).Close
        - (*os.File).Close
        - (*github.com/AndrewChacon/red-marque/pkg/audit.Log).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
        - (*text/tabwriter.Writer).Flush
        - (net.Conn).SetReadDeadline
        - io.Copy
        - (*encoding/json.Encoder).Encode
        - (*github.com/AndrewChacon/red-marque/internal/proxy.Proxy).Serve
    gosec:
      # G104 duplicates errcheck's job with a cruder, non-per-function
      # configurable ruleset — errcheck (with the excludes above) is
      # already the authoritative "is this unchecked error return OK"
      # check in this config.
      #
      # G304 ("potential file inclusion via variable") fires on every
      # os.Open/os.ReadFile/os.OpenFile call with a non-literal path —
      # which describes this project's entire job. scope.Load and
      # audit.Open are *designed* to take an operator-supplied path;
      # THREAT_MODEL.md already states plainly that a scope file is
      # trusted, operator-authored input, not adversarial data from a
      # third party. There's no path in this codebase where G304 would
      # be catching something real.
      excludes:
        - G104
        - G304
  exclusions:
    rules:
      # Test fixtures intentionally use small, bounded values and
      # relaxed file permissions in a throwaway t.TempDir() — the
      # G115/G306-style security scrutiny gosec applies to production
      # code isn't meaningful here.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/marque
    binary: marque
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - formats: [tar.gz]
    # LICENSE*/README* are included automatically.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

# Keyless signing via GitHub Actions OIDC (sigstore/cosign) — no
# private key to generate, store as a secret, or rotate. Signs the
# checksums file; verifying its signature plus each archive's hash
# against that file transitively authenticates every archive.
#
# --bundle (a single .sigstore.json combining the certificate and
# signature) rather than the older separate --output-signature/
# --output-certificate flags: cosign v3 (installed by
# sigstore/cosign-installer) deprecated those in favor of its new
# bundle format and silently ignores them, which surfaced as a real
# release failure ("create bundle file: open : no such file or
# directory") the first time this pipeline actually ran for real.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^lint:"

release:
  footer: >-

    ---

    Verify a release archive against `checksums.txt`, then verify
    `checksums.txt` itself with cosign (keyless):

    ```
    cosign verify-blob checksums.txt \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp 'https://github.com/AndrewChacon/red-marque/.*' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```

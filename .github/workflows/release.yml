name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for cosign's keyless signing — it exchanges this OIDC
  # token for a short-lived signing certificate, no private key ever
  # generated or stored as a secret.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's changelog needs the full tag history, not a
          # shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.3

      - name: Run goreleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
